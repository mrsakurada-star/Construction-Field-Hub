<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工事写真報告書 作成ツール</title>
  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css">
  <!-- IndexedDB 操作モジュール -->
  <script src="js/db.js"></script>
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="logo"><i data-lucide="clipboard-check"></i></div>
    <div><h1>工事写真報告書 作成ツール</h1></div>
    <div class="header-actions">
      <button class="btn btn-outline" type="button" onclick="updatePreview()">
        <i data-lucide="rotate-ccw"></i>プレビュー更新
      </button>
      <button class="btn btn-outline" type="button" onclick="openReorderPage()">
        <i data-lucide="layout-grid"></i>並べ替え
      </button>
      <button class="btn btn-success" type="button" onclick="exportPDF()">
        <i data-lucide="file-down"></i>PDF出力
      </button>
    </div>
  </header>

  <div class="app-body">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="tabs">
        <button class="tab-btn active" type="button" onclick="switchTab('cover', this)">
          <i data-lucide="home"></i>表紙情報
        </button>
        <button class="tab-btn" type="button" onclick="switchTab('photos', this)">
          <i data-lucide="image"></i>写真管理 <span class="count-badge" id="photoCount">0</span>
        </button>
      </div>

      <!-- Cover Tab -->
      <div class="tab-panel active" id="tab-cover">
        <div class="panel-body">
          <div class="section-title">作成者・日付</div>
          <div class="form-group"><label>作成日</label><input type="date" id="coverDate"></div>
          <div class="form-group"><label>管理番号/注文番号</label><input type="text" id="coverManageNo" placeholder="例：2026-0304-001"></div>
          <div class="form-group"><label>弊社管理No</label><input type="text" id="coverOurManageNo" placeholder="例：ABC-12345"></div>
          <div class="form-row">
            <div class="form-group"><label>所属</label><input type="text" id="coverAffiliation" placeholder="株式会社○○"></div>
            <div class="form-group"><label>担当者（作成者）</label><input type="text" id="coverAuthor" placeholder="山田 太郎"></div>
          </div>
          <div class="section-title">工事情報</div>
          <div class="form-group"><label>現場名 / 工事名</label><input type="text" id="coverSiteName" placeholder="○○マンション"></div>
          <div class="form-group"><label>現場住所</label><input type="text" id="coverAddress" placeholder="東京都○○区○○1-2-3"></div>
          <div class="form-group"><label>工事内容</label><textarea id="coverWorkContent" rows="4" placeholder="給湯器取替工事"></textarea></div>
          <div class="form-group">
            <label style="display:flex; align-items:center; justify-content:space-between;">
              工事日
              <button class="btn-icon" type="button" onclick="applyAutoWorkDates()" title="写真の撮影日から自動設定" style="padding:2px 6px; font-size:10px;">
                <i data-lucide="refresh-cw" style="width:12px;height:12px;"></i>自動取得
              </button>
            </label>
            <div class="form-row">
              <input type="date" id="coverWorkStartDate">
              <input type="date" id="coverWorkEndDate">
            </div>
          </div>
          <!-- 工事日借の直下に配置する操作ボタン -->
          <div class="cover-action-row">
            <button class="btn btn-secondary" type="button" onclick="clearStorage()">
              <i data-lucide="trash-2"></i>クリア
            </button>
            <button class="btn btn-danger" type="button" onclick="clearAllPhotos()">
              <i data-lucide="image-off"></i>写真のみ削除
            </button>
          </div>
        </div>
      </div>

      <!-- Photos Tab -->
      <div class="tab-panel" id="tab-photos">
        <div class="panel-body">
          <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
            <div class="upload-icon"><i data-lucide="upload-cloud"></i></div>
            <p>写真をドラッグ＆ドロップ<br>またはクリックして選択</p>
          </div>
          <input type="file" id="fileInput" multiple accept="image/*">
          <div class="photo-list" id="photoList"></div>
        </div>
        <div class="panel-footer">
          <button class="btn btn-secondary" type="button" onclick="clearAllPhotos()"><i data-lucide="trash-2"></i>全削除</button>
          <button class="btn btn-primary" type="button" onclick="updatePreview()"><i data-lucide="rotate-ccw"></i>プレビュー更新</button>
        </div>
      </div>
    </aside>

    <!-- Preview -->
    <main class="preview-area" id="previewArea">
      <div class="preview-empty" id="previewEmpty">
        <div class="icon"><i data-lucide="file-text"></i></div>
        <h3>プレビュー表示中</h3>
      </div>
    </main>
  </div>

  <!-- Progress -->
  <div class="progress-overlay" id="progressOverlay">
    <div class="progress-box">
      <h3><i data-lucide="loader" class="animate-spin"></i> PDF生成中...</h3>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressBar"></div></div>
      <div class="progress-label" id="progressLabel">準備中...</div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/photo.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/pdf_export.js"></script>
  <script>
    let photos = [];
    let nextId = 1;

    function switchTab(name, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + name).classList.add('active');
    }

    function showToast(msg, success = true) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (success ? ' success' : '');
      setTimeout(() => t.classList.remove('show'), 3500);
    }

    // Helper (Legacy code dependencies)
    const escapeHtml = s => (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const escapeAttr = s => (s || '').replace(/"/g, '&quot;');
    const formatDate = d => {
       if(!d) return '';
       const [y,m,d_] = d.split('-');
       return y + '年' + parseInt(m) + '月' + parseInt(d_) + '日';
    };
    const formatDateSlash = d => d ? d.replace(/-/g, '/') : '';
    const formatWorkPeriod = (s, e) => {
       if(!s && !e) return '　';
       const start = formatDateSlash(s);
       const end = formatDateSlash(e);
       if(!e || s === e) return start || '　';
       return start + ' 〜 ' + end;
    };

    window.addEventListener('DOMContentLoaded', async () => {
      lucide.createIcons();
      // IndexedDB を初期化してからデータを読み込む
      await initDB();
      await loadFromStorage();
      initUpload();
      updatePreview();
      document.querySelectorAll('#tab-cover input, #tab-cover textarea').forEach(el => {
        el.addEventListener('input', () => { saveToStorage(); });
      });
    });

    /** 並べ替えページを別タブで開く */
    function openReorderPage() {
      saveToStorage(); // 最新情報を保存してから遷移
      window.open('reorder.html', '_blank');
    }
  </script>
</body>
</html>
