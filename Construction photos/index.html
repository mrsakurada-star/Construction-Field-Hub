<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工事写真報告書 作成ツール</title>
  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css">
  <!-- 共通ユーティリティ（STORAGE_KEY・日付整形） -->
  <script src="js/common.js"></script>
  <!-- IndexedDB 操作モジュール -->
  <script src="js/db.js"></script>
  <!--
    === 更新内容 (2026-07-06) ===
    - フォームラベル: label-input 関連付け（for属性）で axe/forms 検査に対応
    - アクセシビリティ: 非表示 file input に aria-label を追加
    - スタイル: インラインスタイルを CSS クラスに移行
      * .work-date-label: 工事日ラベルのflex レイアウト
      * .auto-get-btn: 自動取得ボタンのスタイル
      * .form-row > div: 工事日開始/終了日の label/input ラッパー
    - 複数行対応: 写真説明の改行を PDF プレビューで正しく表示
  -->
  <!--
    === 更新内容 (2026-07-07) ===
    - 工程管理機能: 工程マスター（表紙タブ）、写真への工程/前中後割当て
    - 写真管理タブ: 工程×前中後でグルーピング表示、ドラッグ&ドロップで工程割当て
    - PDF出力: 工程順→前中後順にソートし、工程名見出しを表示
  -->
  <!--
    === 更新内容 (2026-07-07その2) ===
    - 複数選択機能: 写真カードにチェックボックスを追加
    - 一括削除・一括工程/phase移動用のフローティングツールバーを追加
    - 選択状態はセッション内のみ保持（一括操作実行後に自動クリア）
  -->
  <!--
    === 更新内容 (2026-07-07その3) ===
    - 工事報告補足入力: 表紙タブに「補足情報」textareaを追加
    - PDF/プレビュー出力: 補足情報が入力されている場合のみ、
      表紙ページと写真ページの間に独立した補足ページを挿入
    - 写真ページのページ番号フッターに補足ページ分のオフセットを反映
  -->
  <!--
    === 更新内容 (2026-07-08) ===
    - 写真管理タブ: 写真カードを直接ドラッグして並び替えられるように変更
    - ドラッグ先が別の工程/前中後グループの場合、そのグループへ移動しつつ
      指定位置に挿入する（工程ヘッダーへのドロップによる割当てとは独立して機能）
  -->
  <!--
    === 更新内容 (2026-07-15) ===
    - PDF/プレビュー: 工程ごとに必ず改ページするように変更
      （同一ページ内に複数工程の写真が混在しないようにした）
    - 並べ替えページ（reorder.html）: 各カードに工程・前中後バッジと
      説明文を表示するように変更（並べ替え自体の挙動は変更なし）
  -->
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="logo"><i data-lucide="clipboard-check"></i></div>
    <div><h1>工事写真報告書 作成ツール</h1></div>
    <div class="header-actions">
      <button class="btn btn-outline" type="button" onclick="updatePreview()">
        <i data-lucide="rotate-ccw"></i>プレビュー更新
      </button>
      <button class="btn btn-success" type="button" onclick="exportPDF()">
        <i data-lucide="file-down"></i>PDF出力
      </button>
    </div>
  </header>

  <div class="app-body">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="tabs">
        <button class="tab-btn active" type="button" onclick="switchTab('cover', this)">
          <i data-lucide="home"></i>表紙情報
        </button>
      </div>

      <!-- Cover Tab -->
      <div class="tab-panel active" id="tab-cover">
        <div class="panel-body">
          <div class="section-title">作成者・日付</div>
          <div class="form-group"><label for="coverDate">作成日</label><input type="date" id="coverDate"></div>
          <div class="form-group"><label>管理番号/注文番号</label><input type="text" id="coverManageNo" placeholder="例：2026-0304-001"></div>
          <div class="form-group"><label>弊社管理No</label><input type="text" id="coverOurManageNo" placeholder="例：ABC-12345"></div>
          <div class="form-row">
            <div class="form-group"><label>所属</label><input type="text" id="coverAffiliation" placeholder="株式会社○○"></div>
            <div class="form-group"><label>担当者（作成者）</label><input type="text" id="coverAuthor" placeholder="山田 太郎"></div>
          </div>
          <div class="section-title">工事情報</div>
          <div class="form-group"><label>現場名 / 工事名</label><textarea id="coverSiteName" rows="2" placeholder="○○マンション"></textarea></div>
          <div class="form-group"><label>現場住所</label><textarea id="coverAddress" rows="2" placeholder="東京都○○区○○1-2-3"></textarea></div>
          <div class="form-group"><label>工事内容</label><textarea id="coverWorkContent" rows="4" placeholder="給湯器取替工事"></textarea></div>
          <div class="section-title">補足情報</div>
          <div class="form-group"><label>補足情報</label><textarea id="coverSupplement" rows="4" placeholder="既設の配管を活用し...後日、完工検査を実施予定です"></textarea></div>
          <div class="section-title">工程一覧</div>
          <div class="process-add-row">
            <input type="text" id="processNameInput" placeholder="例：基礎工事" aria-label="工程名">
            <button class="btn btn-outline" type="button" onclick="handleAddProcess()">
              <i data-lucide="plus"></i>追加
            </button>
          </div>
          <div class="process-list" id="processList"></div>
          <div class="form-group">
            <label class="work-date-label">
              <span>工事日</span>
              <button class="btn-icon auto-get-btn" type="button" onclick="applyAutoWorkDates()" title="写真の撮影日から自動設定">
                <i data-lucide="refresh-cw"></i>自動取得
              </button>
            </label>
            <div class="form-row">
              <div><label for="coverWorkStartDate">開始日</label><input type="date" id="coverWorkStartDate"></div>
              <div><label for="coverWorkEndDate">終了日</label><input type="date" id="coverWorkEndDate"></div>
            </div>
          </div>
          <!-- 表紙タブの工程一覧UI は廃止（フェーズ2: 写真管理タブに統合） -->
          <!-- 工事日直下に配置する操作ボタン -->
          <div class="cover-action-row">
            <button class="btn btn-secondary" type="button" onclick="clearStorage()">
              <i data-lucide="trash-2"></i>クリア
            </button>
            <button class="btn btn-danger" type="button" onclick="clearAllPhotos()">
              <i data-lucide="image-off"></i>写真のみ削除
            </button>
          </div>
        </div>
      </div>

    </aside>

    <!-- Main content area -->
    <main class="main-content">
      <!-- View toggle buttons -->
      <div class="view-toggle-bar">
        <button class="view-toggle-btn active" type="button" id="viewEditBtn" onclick="switchViewMode('edit')">
          <i data-lucide="edit-3"></i>写真編集
        </button>
        <button class="view-toggle-btn" type="button" id="viewPreviewBtn" onclick="switchViewMode('preview')">
          <i data-lucide="file-text"></i>PDFプレビュー
        </button>
      </div>

      <!-- Photo Edit View -->
      <div class="view-content active" id="photoEditView">
        <div class="photo-edit-container">
          <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
            <div class="upload-icon"><i data-lucide="upload-cloud"></i></div>
            <p>写真をドラッグ＆ドロップ<br>またはクリックして選択</p>
          </div>
          <input type="file" id="fileInput" multiple accept="image/*" aria-label="写真をアップロード">
          <div class="selection-toolbar" id="selectionToolbar" hidden>
            <span class="selection-count" id="selectionCount">0枚選択中</span>
            <button class="btn btn-outline" type="button" onclick="clearSelection()">選択を解除</button>
            <select id="bulkMoveProcessSelect" aria-label="移動先の工程"></select>
            <button class="btn btn-outline" type="button" onclick="bulkMoveSelected()">
              <i data-lucide="move"></i>移動
            </button>
            <button class="btn btn-danger" type="button" onclick="bulkDeleteSelected()">
              <i data-lucide="trash-2"></i>削除
            </button>
          </div>
          <div class="photo-list" id="photoList"></div>
        </div>
      </div>

      <!-- PDF Preview View -->
      <div class="view-content" id="pdfPreviewView">
        <div class="preview-area" id="previewArea">
          <div class="preview-empty" id="previewEmpty">
            <div class="icon"><i data-lucide="file-text"></i></div>
            <h3>プレビュー表示中</h3>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Lightbox (Full-screen photo preview) -->
  <div class="lightbox-overlay" id="lightboxOverlay" hidden>
    <div class="lightbox-container">
      <div class="lightbox-header">
        <button class="lightbox-close" type="button" onclick="closeLightbox()" title="閉じる（Esc）">
          <svg class="icon-svg" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="lightbox-body">
        <button class="lightbox-nav-prev" type="button" onclick="lightboxNav(-1)" title="前の写真（←）" id="lightboxPrevBtn">
          <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <div class="lightbox-image-cell">
          <img class="lightbox-image" id="lightboxImage" src="" alt="">
          <div class="lightbox-image-info">
            <span class="lightbox-filename" id="lightboxFilename"></span>
            <span id="lightboxExifBadge" style="display:none;" class="exif-badge">
              <svg class="icon-svg" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>EXIF
            </span>
          </div>
        </div>
        <button class="lightbox-nav-next" type="button" onclick="lightboxNav(1)" title="次の写真（→）" id="lightboxNextBtn">
          <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>
      <div class="lightbox-footer">
        <div class="lightbox-meta-form">
          <div class="lightbox-field">
            <label>撮影日</label>
            <input type="date" id="lightboxDate" onchange="updateLightboxField('date', this.value)">
          </div>
          <div class="lightbox-field">
            <label>タイトル</label>
            <input type="text" id="lightboxTitle" placeholder="作業前①" oninput="updateLightboxField('title', this.value)">
          </div>
          <div class="lightbox-field">
            <label>説明</label>
            <textarea id="lightboxDesc" rows="2" placeholder="外観" oninput="updateLightboxField('desc', this.value)"></textarea>
          </div>
          <div class="lightbox-field">
            <label>任意ラベル</label>
            <input type="text" id="lightboxLabel" placeholder="施工前/施工後 など" oninput="updateLightboxField('label', this.value)">
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Progress -->
  <div class="progress-overlay" id="progressOverlay">
    <div class="progress-box">
      <h3><i data-lucide="loader" class="animate-spin"></i> PDF生成中...</h3>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressBar"></div></div>
      <div class="progress-label" id="progressLabel">準備中...</div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/photo.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/pdf_export.js"></script>
  <script>
    let photos = [];
    let nextId = 1;
    let processes = [];
    let nextProcessId = 1;

    function switchTab(name, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + name).classList.add('active');
    }

    function showToast(msg, success = true) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (success ? ' success' : '');
      setTimeout(() => t.classList.remove('show'), 3500);
    }

    // Helper（escapeHtml/escapeAttr/formatDateSlash/formatWorkPeriod）
    // STORAGE_KEY と formatDate は js/common.js に集約済み
    const escapeHtml = s => (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const escapeAttr = s => (s || '').replace(/"/g, '&quot;');
    const formatDateSlash = d => d ? d.replace(/-/g, '/') : '';
    const formatWorkPeriod = (s, e) => {
       if(!s && !e) return '　';
       const start = formatDateSlash(s);
       const end = formatDateSlash(e);
       if(!e || s === e) return start || '　';
       return start + ' 〜 ' + end;
    };

    window.addEventListener('DOMContentLoaded', async () => {
      lucide.createIcons();
      // IndexedDB を初期化してからデータを読み込む
      await initDB();
      await loadFromStorage();
      initUpload();
      updatePreview();
      document.querySelectorAll('#tab-cover input, #tab-cover textarea').forEach(el => {
        el.addEventListener('input', () => { saveToStorage(); });
      });
    });

    /** 工程追加ボタンのハンドラ。入力欄をクリアしてから追加する */
    function handleAddProcess() {
      const input = document.getElementById('processNameInput');
      addProcess(input.value);
      input.value = '';
    }

    /** ビュー切替（写真編集 ⇄ PDFプレビュー） */
    function switchViewMode(mode) {
      const editView = document.getElementById('photoEditView');
      const previewView = document.getElementById('pdfPreviewView');
      const editBtn = document.getElementById('viewEditBtn');
      const previewBtn = document.getElementById('viewPreviewBtn');

      if (mode === 'edit') {
        editView.classList.add('active');
        previewView.classList.remove('active');
        editBtn.classList.add('active');
        previewBtn.classList.remove('active');
      } else {
        editView.classList.remove('active');
        previewView.classList.add('active');
        editBtn.classList.remove('active');
        previewBtn.classList.add('active');
        updatePreview(); // プレビュー表示時に最新化
      }
    }

  </script>
</body>
</html>
