<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>写真並べ替え | 工事写真報告書 作成ツール</title>
  <link rel="stylesheet" href="css/reorder.css">
</head>
<body>

  <!-- ヘッダー -->
  <header class="reorder-header">
    <div class="logo">
      <!-- ドラッグアイコン（SVG） -->
      <svg style="width:20px;height:20px;stroke:#2a2a24;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;" viewBox="0 0 24 24">
        <polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/>
        <polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/>
        <line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/>
      </svg>
    </div>
    <h1>写真並べ替え</h1>
    <span class="header-hint">ドラッグ＆ドロップで順番を変更できます</span>
    <div class="header-actions">
      <button class="btn btn-outline" type="button" onclick="window.location.href='index.html'">
        <!-- 戻るアイコン -->
        <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        メインへ戻る
      </button>
      <button class="btn btn-outline" type="button" onclick="saveOrder()">
        <!-- 保存アイコン -->
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        この順番で保存
      </button>
      <button class="btn btn-primary" type="button" onclick="saveAndBack()">
        <!-- チェックアイコン -->
        <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        保存してメインへ
      </button>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="reorder-main">
    <div class="reorder-info">
      <span>全</span>
      <span class="photo-count-badge" id="photoCountBadge">0枚</span>
      <span>の写真が登録されています。ドラッグして並び順を変更し、保存してください。</span>
    </div>

    <!-- サムネイルグリッド -->
    <div class="thumb-grid" id="thumbGrid"></div>

    <!-- 写真がない場合の表示 -->
    <div class="empty-state" id="emptyState" style="display:none;">
      <svg style="width:48px;height:48px;stroke:#aaa;stroke-width:1.5;fill:none;margin-bottom:16px;" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
      <h3>写真が登録されていません</h3>
      <p style="font-size:13px;color:#888;margin-top:8px;">メインページで写真を追加してください。</p>
    </div>
  </main>

  <!-- トースト通知 -->
  <div class="toast" id="toast"></div>

  <!-- スクリプト -->
  <!-- IndexedDB 操作モジュール（db.js） -->
  <script src="js/db.js"></script>
  <!-- 並べ替えロジック -->
  <script src="js/reorder.js"></script>
  <script>
    // ページロード時に初期化
    window.addEventListener('DOMContentLoaded', () => {
      initReorder();
    });
  </script>
</body>
</html>
