<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サービス報告書・点検履歴台帳 | Construction Field Hub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="top-label-en">Service Book</div>
    <h1>サービス報告書・点検履歴台帳</h1>
    <div id="folder-disconnected-banner" class="banner" style="display:none">
      <span>dataフォルダ未接続</span>
      <button class="btn btn-sm btn-primary" type="button" onclick="connectDataFolder()">フォルダを接続</button>
    </div>
    <div id="folder-connected-banner" class="banner" style="display:none">
      <span>同期中: <strong id="folder-connected-name">—</strong></span>
      <button class="btn btn-sm btn-secondary" type="button" onclick="disconnectDataFolder()">解除</button>
    </div>
    <div id="global-sync-alert" class="banner" style="display:none">
      <span>フォルダの再接続が必要です</span>
      <button class="btn btn-sm btn-primary" type="button" onclick="reconnectAllFiles()">再接続</button>
    </div>
  </header>

  <nav class="nav">
    <button class="nav-item active" data-page="intake" type="button">新規依頼発行</button>
    <button class="nav-item" data-page="customers" type="button">顧客管理</button>
    <button class="nav-item" data-page="equipments" type="button">機器管理</button>
    <button class="nav-item" data-page="records" type="button">サービス記録 <span id="nav-badge-stale" class="badge badge-expired" style="display:none">0</span></button>
    <button class="nav-item" data-page="print" type="button">報告書印刷</button>
  </nav>

  <main>
    <section id="page-intake" class="page active"></section>
    <section id="page-customers" class="page">
      <div class="page-head">
        <h2>顧客管理</h2>
        <div class="page-actions">
          <input id="customer-search" class="search" type="search" placeholder="顧客名・住所・連絡先・ハウスメーカーで検索">
          <button class="btn btn-primary" type="button" onclick="openCustomerModal()">顧客を追加</button>
        </div>
      </div>
      <table class="data-table">
        <thead><tr><th>顧客名</th><th>連絡先</th><th>住所</th><th>ハウスメーカー</th><th>操作</th></tr></thead>
        <tbody id="customer-list"></tbody>
      </table>
    </section>
    <section id="page-equipments" class="page">
      <div class="page-head">
        <h2>機器管理</h2>
        <div class="page-actions">
          <select id="equipment-customer-filter"></select>
          <input id="equipment-search" class="search" type="search" placeholder="型式・メーカー・用途・ロットで検索">
          <button class="btn btn-primary" type="button" onclick="openEquipmentModal()">機器を追加</button>
        </div>
      </div>
      <table class="data-table">
        <thead><tr><th>顧客</th><th>メーカー / 型式</th><th>製品ロット</th><th>用途</th><th>設置日</th><th>操作</th></tr></thead>
        <tbody id="equipment-list"></tbody>
      </table>
    </section>
    <section id="page-records" class="page">
      <div class="page-head">
        <h2>サービス記録</h2>
        <div class="page-actions">
          <select id="record-equipment-filter"></select>
          <span id="stale-summary" class="badge badge-expired" style="display:none"></span>
          <button class="btn btn-primary" type="button" onclick="openRecordModal()">記録を追加</button>
        </div>
      </div>
      <table class="data-table">
        <thead><tr><th>状態</th><th>受付日 / 対応日</th><th>管理番号</th><th>機器</th><th>作業種別</th><th>担当</th><th>操作</th></tr></thead>
        <tbody id="record-list"></tbody>
      </table>
    </section>
    <section id="page-print" class="page"></section>
  </main>

  <div id="modal-root">
    <div id="customer-modal" class="modal">
      <div class="modal-box">
        <h3 id="customer-modal-title">顧客を追加</h3>
        <input type="hidden" id="customer-id">
        <label>顧客名<input id="customer-name" type="text"></label>
        <label>フリガナ<input id="customer-kana" type="text"></label>
        <label>連絡先（担当・TEL）<input id="customer-contact" type="text"></label>
        <label>住所<input id="customer-address" type="text"></label>
        <label>依頼元 / 販売店<input id="customer-dealerName" type="text"></label>
        <label>ハウスメーカー<input id="customer-houseMaker" type="text"></label>
        <label>特記事項（報告書に印刷）<textarea id="customer-printNote"></textarea></label>
        <label>備考（社内用・印刷されません）<textarea id="customer-memo"></textarea></label>
        <div class="modal-actions">
          <button class="btn btn-secondary" type="button" onclick="closeModal('customer-modal')">キャンセル</button>
          <button class="btn btn-success" type="button" onclick="saveCustomer()">保存</button>
        </div>
      </div>
    </div>
    <div id="equipment-modal" class="modal">
      <div class="modal-box">
        <h3 id="equipment-modal-title">機器を追加</h3>
        <input type="hidden" id="equipment-id">
        <label>顧客<select id="equipment-customerId"></select></label>
        <label>メーカー<input id="equipment-maker" type="text" placeholder="パーパス / ノーリツ / リンナイ / パロマ"></label>
        <label>型式<input id="equipment-modelNo" type="text"></label>
        <label>製品ロット / 製造番号<input id="equipment-lotNo" type="text"></label>
        <label>機器区分<input id="equipment-category" type="text" placeholder="給湯器 / 風呂釜 / レンジフード"></label>
        <label>ガス種別<input id="equipment-gasType" type="text" placeholder="都市ガス / LPG"></label>
        <label>設置日<input id="equipment-installDate" type="date"></label>
        <label>用途<input id="equipment-usage" type="text" placeholder="浴室給湯 / 厨房給湯 / 暖房"></label>
        <label>備考<textarea id="equipment-memo"></textarea></label>
        <div class="modal-actions">
          <button class="btn btn-secondary" type="button" onclick="closeModal('equipment-modal')">キャンセル</button>
          <button class="btn btn-success" type="button" onclick="saveEquipment()">保存</button>
        </div>
      </div>
    </div>
    <div id="record-modal" class="modal">
      <div class="modal-box modal-wide">
        <h3 id="record-modal-title">記録を追加</h3>
        <input type="hidden" id="record-id">
        <label>機器<select id="record-equipmentId"></select></label>
        <div class="grid2">
          <label>管理番号<input id="record-mgmtNo" type="text"></label>
          <label>作業種別<select id="record-workType">
            <option>定期点検</option><option>故障修理</option><option>アラーム対応</option><option>設置</option>
          </select></label>
          <label>受付日<input id="record-receivedDate" type="date"></label>
          <label>受付者<input id="record-receptionist" type="text"></label>
          <label>希望日<input id="record-requestedDate" type="date"></label>
          <label>対応日<input id="record-serviceDate" type="date"></label>
          <label>完了日<input id="record-completionDate" type="date"></label>
          <label>担当者<input id="record-staff" type="text"></label>
        </div>
        <label>コール内容<textarea id="record-callContent"></textarea></label>
        <label>担当者所見<textarea id="record-remarks"></textarea></label>
        <label>お客様への報告<textarea id="record-customerReport"></textarea></label>
        <h4>交換部品</h4>
        <table class="data-table"><thead><tr><th>品名</th><th>数量</th><th>単価</th><th></th></tr></thead>
          <tbody id="record-parts"></tbody></table>
        <button class="btn btn-xs btn-secondary" type="button" onclick="addPartRow()">部品を追加</button>
        <div class="grid2" style="margin-top:12px">
          <label>出張料<input id="record-visitFee" type="number"></label>
          <label>技術料<input id="record-laborFee" type="number"></label>
          <div>部品代: <span id="record-partsFee">¥0</span></div>
          <div>合計: <strong id="record-total">¥0</strong></div>
        </div>
        <div class="modal-actions">
          <button class="btn btn-secondary" type="button" onclick="closeModal('record-modal')">キャンセル</button>
          <button class="btn btn-success" type="button" onclick="saveRecord()">保存</button>
        </div>
      </div>
    </div>
  </div>
  <div id="toast" class="toast"></div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/normalize.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
